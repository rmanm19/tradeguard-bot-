# جلوگیری از غیرفعال‌شدن زمان‌بندی بعد از ۶۰ روز بی‌فعالیتی ریپو
name: Keepalive
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "tradeguard-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)" || true
          git push || true
